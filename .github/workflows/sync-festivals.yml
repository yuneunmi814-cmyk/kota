name: sync-festivals

# 축제 데이터 주간 자동 갱신 — 매주 월요일 09:00 KST(일 00:00 UTC).
# 공공데이터(TourAPI + 전국문화축제표준데이터)를 다시 긁어 베이크 파일을 갱신하고,
# 변경이 있으면 커밋 → deploy-web(Pages)과 Render가 각자 자동 배포된다.
on:
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 00:00 UTC = 월요일 09:00 KST
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: sync-festivals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kota
          POSTGRES_PASSWORD: kota
          POSTGRES_DB: kota_sync
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U kota -d kota_sync"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://kota:kota@localhost:5432/kota_sync
      TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 키 확인
        run: |
          if [ -z "$TOURAPI_SERVICE_KEY" ]; then
            echo "::error::TOURAPI_SERVICE_KEY 시크릿이 없습니다. Settings → Secrets → Actions 에 등록하세요."
            exit 1
          fi

      - run: npm ci
        working-directory: backend

      # 빈 DB에 스키마만 올리고 지역 시드 → 축제 동기화 (기존 운영 DB는 건드리지 않음)
      - name: DB 준비
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: 축제 동기화 (TourAPI 전국 + 표준데이터)
        working-directory: backend
        run: npm run sync:festivals -- --all --std
      # 지역기반(areaBasedList2) — 커버리지 보강. 상세 조회는 area-intro-cache.json에 누적돼
      # 신규 축제만 API를 부른다(429 방지). 한도에 걸리면 다음 주에 이어서.
      - name: Sync festivals (area-based)
        working-directory: backend
        env:
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kota_sync
        run: npm run sync:festivals -- --area
      # 좌표 없는 축제(문체부 소스 등) 지오코딩 — 멱등·쿼터 감지 내장, 매주 조금씩 누적
      - name: Geocode festivals
        working-directory: backend
        env:
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kota_sync
        run: npm run geocode:festivals

      - name: 지역 재분류·중복 정리
        working-directory: backend
        run: npm run fix:festival-regions

      # 종료된 축제는 베이크·정적 데이터에서 제외(용량·신선도)
      - name: 베이크 + 웹 정적 데이터 내보내기
        working-directory: backend
        run: |
          npm run bake:festivals
          npm run export:web

      - name: 변경분 커밋
        run: |
          git config user.name "kota-bot"
          git config user.email "actions@github.com"
          git add backend/prisma/seed-festivals.json backend/prisma/area-intro-cache.json web/public/data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            COUNT=$(node -e "console.log(require('./backend/prisma/seed-festivals.json').items.length)")
            git commit -m "chore(festivals): 주간 자동 동기화 — 예정 축제 ${COUNT}건

             매주 월요일 09:00 KST 자동 실행 (.github/workflows/sync-festivals.yml)"
            git push
          fi
